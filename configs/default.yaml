project:
  name: bam-vision-demo
  seed: 42
  output_dir: runs/baseline-cnn

data:
  raw_dir: data/raw
  processed_dir: data/processed
  train_dir: data/train
  val_dir: data/val
  img_size: 224
  val_split: 0.15
  test_split: 0.15
  seed: 42
  num_workers: 2

augmentation:
  target_ratio: 0.3

training:
  epochs: 8
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler_step_size: 3
  scheduler_gamma: 0.5

model:
  num_classes: 2
  dropout: 0.25
