project:
  name: bam-vision-demo
  seed: 42
  output_dir: runs/baseline-cnn

data:
  train_dir: data/train
  val_dir: data/val
  img_size: 224
  num_workers: 2

training:
  epochs: 8
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler_step_size: 3
  scheduler_gamma: 0.5

model:
  num_classes: 2
  dropout: 0.25
